


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Parent-First Academic Center Management">
<link rel="stylesheet" href="/academic-center/css/themes.css">
<link rel="stylesheet" href="/academic-center/css/components.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/academic-center/css/login.css">

<html lang="en" data-theme="ocean">
<head>
    <title>Login - Academic Center</title>
</head>
<body>
    <header class="main-header">
    <div class="header-content">
        <div class="logo-section">
            <h1><i class="fas fa-graduation-cap"></i> ThinkSpire Academy</h1>
        </div>
        
        <div class="header-actions desktop-header-actions">
                        
            <a href="#" id="theme-toggle-button" class="theme-toggle-button">
                <i class="fas fa-moon"></i>
            </a>
            
        </div>
        
        <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>
    
    <div class="main-container">
        
        
        <main class="content-area">
            <div class="login-page-wrapper">
                <div class="login-container">
                    <p style='color:red;'>Invalid username or password.</p>

                    <h2>Parent Login</h2>
                    <form action="login_process.jsp" method="post">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" class="input-field" required>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" class="input-field" required>
                        <button type="submit" class="button">Login</button>
                    </form>
                    <p>Don't have an account? <a href="register.jsp">Register here</a></p>
                    <p><a href="forgot_password.jsp">Forgot Password?</a></p>
                </div>
            </div>
        </main>
    </div>
    
        <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 Academic Center Management System. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
